[package]
name = "prtgn"
version = "0.4.2"
edition = "2024"
readme = "README.md"
authors = ["PRTGN Development Team", "ExoticDG"]
description = "A protogen CLI resource."
license-file = "LICENSE"
repository = "https://github.com/PRTGN-Development-Team/.prtgn"
homepage = "https://github.com/PRTGN-Development-Team/.prtgn"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.0", features = ["all-widgets"] }
ratatui-textarea = "0.8.0"
clap = { version = "4.6.0", features = ["derive"] }
rodio = "0.22.2"
prtgn_encoding = "0.2.0"
color-eyre = "0.6.5"
hound = "3.5.1"
indicatif = "0.18.4"
claxon = "0.4.3"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
image = "0.25.10"
tokio = { version = "1.52.1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
colored = "3.1.1"
tui-input = "0.15.0"



[package.metadata.rpm]
package = "prtgn"
depends = "alsa-lib-devel"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
prtgn = { path = "/usr/bin/prtgn" }

[package.metadata.deb]
depends = "libasound2-dev"
